 <title>Login Page</title>
  <style>body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to right , #005B96 , #87CEFA , #ADD8E6 );
}

.login-container {
  width: 300px;
  margin: 100px auto;
  padding: 20px;
  border: 1px solid #0056B3;
  border-radius: 5px;
}

h2 {
  text-align: center;
}

input[type="text"],
input[type="password"],
button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
}

button {
  background-color: #007BFF;
  color: #FFF;
  border: none;
  border-radius: 3px;
  cursor: pointer;
}

button:hover {
  background-color: #0056B3;
}

.error {
  color: red;
  text-align: center;
}</style>
</head>
<body>

  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="error" class="error"></p>
  </div>

  <script src="login.js"></script>
</body>

</html>
